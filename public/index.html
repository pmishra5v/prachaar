<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Prachaar: AI CMO demo for Indian auto-parts distributors.">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Prachaar AI CMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#EBEEF3; --ink:#18202C; --muted:#5A6475; --line:#D9DEE6;
  --accent:#F2B705; --accent-ink:#1A1400; --accent-soft:#FFF4CC; --brand:#23395D; --brand-ink:#FFFFFF;
  --good:#1E8E5A; --good-soft:#E3F4EB; --warn:#B26A00; --warn-soft:#FFF0DA; --bad:#C0392B; --bad-soft:#FBE6E3;
  --wa:#1FA855; --wa-bubble:#DCF8C6; --wa-bg:#ECE5DD; --fb:#1B74E4; --ig1:#F58529; --ig2:#DD2A7B; --ig3:#8134AF;
  --me:#23395D; --me-ink:#FFFFFF;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans","Noto Sans Devanagari","Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F131A; --surface:#171C25; --surface-2:#1F2631; --ink:#E6EAF1; --muted:#9AA4B5; --line:#2C3441;
    --accent:#F5C12E; --accent-ink:#1A1400; --accent-soft:#3A3113; --brand:#9DB6E0; --brand-ink:#0F131A;
    --good:#4CC38A; --good-soft:#15301F; --warn:#F0A43A; --warn-soft:#352711; --bad:#F07565; --bad-soft:#3A1C18;
    --wa-bubble:#1F3B2A; --wa-bg:#11161C; --me:#2E4A78; --me-ink:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F131A; --surface:#171C25; --surface-2:#1F2631; --ink:#E6EAF1; --muted:#9AA4B5; --line:#2C3441;
  --accent:#F5C12E; --accent-ink:#1A1400; --accent-soft:#3A3113; --brand:#9DB6E0; --brand-ink:#0F131A;
  --good:#4CC38A; --good-soft:#15301F; --warn:#F0A43A; --warn-soft:#352711; --bad:#F07565; --bad-soft:#3A1C18;
  --wa-bubble:#1F3B2A; --wa-bg:#11161C; --me:#2E4A78; --me-ink:#FFFFFF;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;max-width:1440px;margin:0 auto}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.plate{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);padding:1px 10px;border:2px solid var(--accent-ink);border-radius:4px;line-height:1.2}
.biz{min-width:0}
.biz b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.biz span{color:var(--muted);font-size:12px}
.mode{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.wachip{font-size:12px;font-weight:600;text-decoration:none;padding:3px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.wachip.on{background:var(--good-soft);color:var(--good)}
#acctLinks{display:inline-flex;gap:6px;align-items:center}
.dot.on{background:var(--good)} .dot.off{background:var(--warn)}
.ghost{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;font-size:12px}
.ghost:hover{background:var(--surface-2)}
.switch{display:none;width:100%;gap:4px;background:var(--surface-2);padding:3px;border-radius:8px}
.switch button{flex:1;border:0;background:transparent;padding:6px;border-radius:6px;font-weight:500}
.switch button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}

main.panes{display:grid;grid-template-columns:minmax(340px,42%) 1fr;min-height:0}
.chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--surface)}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;white-space:normal;overflow-wrap:anywhere}
.msg p{margin:0} .msg p+p,.msg ul+p,.msg p+ul{margin-top:6px}
.msg ul{margin:0;padding-left:18px}
.msg.ai{background:var(--surface-2);align-self:flex-start;border-top-left-radius:4px}
.msg.me{background:var(--me);color:var(--me-ink);align-self:flex-end;border-top-right-radius:4px}
.msg.note{align-self:center;background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:12px;max-width:100%;text-align:center}
.who{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.act{font-size:11px;font-family:var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.act.ok{border-color:var(--good);color:var(--good)} .act.err{border-color:var(--bad);color:var(--bad)}
.thinking{color:var(--muted);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;text-align:left}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
form.composer{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line);align-items:flex-end}
form.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;background:var(--bg);color:var(--ink);min-height:42px;max-height:140px}
.send{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:10px;padding:10px 16px}
.send[disabled]{opacity:.5;cursor:not-allowed}
.mic{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;min-width:44px;justify-content:center}
.mic:hover{border-color:var(--accent)}
.mic-t{font-size:13px;font-weight:600}
.vpanel{display:flex;align-items:center;gap:12px;padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--surface)}
.vorb{position:relative;width:44px;height:44px;border-radius:50%;background:var(--surface-2);flex:0 0 auto;display:grid;place-items:center;overflow:hidden}
.vorb span{position:absolute;inset:auto 0 0 0;height:0;background:var(--accent);opacity:.85;transition:height .08s linear}
.vorb::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--muted);position:relative}
.vpanel[data-state="listening"] .vorb::after{background:var(--bad)}
.vpanel[data-state="thinking"] .vorb{animation:vthink 1s ease-in-out infinite}
.vpanel[data-state="speaking"] .vorb::after{background:var(--good)}
@keyframes vthink{50%{opacity:.5}}
@media (prefers-reduced-motion: reduce){.vpanel[data-state="thinking"] .vorb{animation:none}}
.vtext{display:flex;flex-direction:column;min-width:0;flex:1}
.vtext b{font-size:14px}
.vtext span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.vend{background:var(--bad);border-color:var(--bad);color:#fff}
.stop{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}

.work{display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;gap:2px;padding:10px 16px 0;border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 12px;border-bottom:2px solid transparent;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-family:var(--mono);font-size:11px;background:var(--surface-2);border-radius:999px;padding:0 6px;margin-left:4px}
.pane{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.pane>*{flex-shrink:0}
.sampletag{font-size:11px;color:var(--muted);letter-spacing:.04em}
h2.sec{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;text-wrap:balance}

.camp{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.camp.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){.camp.flash{animation:none}}
.camp-h{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.camp-h h3{margin:0;font-size:16px;font-weight:600;flex:1;min-width:180px}
.meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px;font-weight:400}
.pill{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.draft{background:var(--accent-soft);color:var(--warn)}
.pill.sending{background:var(--surface-2);color:var(--muted)}
.pill.sent{background:var(--good-soft);color:var(--good)}
.pill.discarded{background:var(--surface-2);color:var(--muted)}
.previews{display:flex;gap:14px;padding:14px;overflow-x:auto;background:var(--bg)}
.pv{flex:0 0 260px;display:flex;flex-direction:column;gap:6px}
.pv-l{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block}
.wa{background:var(--wa-bg);border-radius:10px;padding:10px;min-height:120px}
.wa-b{background:var(--wa-bubble);border-radius:8px;border-top-left-radius:2px;padding:6px 8px;font-size:12.5px;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.08);overflow-wrap:anywhere}
.wa-b .poster{margin-bottom:6px}
.wa-btns{display:flex;gap:4px;margin-top:4px}
.wa-btns span{flex:1;text-align:center;background:var(--wa-bubble);border-radius:8px;padding:6px;font-size:12.5px;font-weight:600;color:#027EB5;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.tplnote{font-size:11.5px;color:var(--muted);margin-top:6px}
.wa-t{text-align:right;font-size:10px;color:var(--muted)}
.fb,.ig{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12.5px}
.post-h{display:flex;align-items:center;gap:8px;padding:8px 10px}
.av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;display:grid;place-items:center;font-size:12px;flex:0 0 auto}
.ig .av{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ig2)}
.post-h b{font-size:12px;display:block;line-height:1.2}
.post-h small{color:var(--muted);font-size:10.5px}
.post-t{padding:0 10px 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.ig .post-t{padding-top:8px}
.post-f{display:flex;justify-content:space-between;padding:6px 10px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
.boost{font-size:11px;background:var(--accent-soft);color:var(--ink);padding:3px 10px}

.poster{position:relative;background:var(--brand);color:#fff;aspect-ratio:1/1;max-width:100%;padding:12px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;border-radius:0}
.wa .poster{border-radius:6px;aspect-ratio:auto;min-height:190px;gap:8px}
.poster::before{content:"";position:absolute;inset:auto -30% -45% auto;width:90%;aspect-ratio:1;border-radius:50%;border:18px solid rgba(255,255,255,.07)}
.poster .tag{align-self:flex-start;background:#F2B705;color:#1A1400;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:30px;line-height:1;padding:4px 10px 3px;border:2px solid #1A1400;border-radius:4px;letter-spacing:.02em}
.poster .hl{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:21px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;position:relative}
.poster .pn{font-size:11px;opacity:.85;margin-top:3px;position:relative}
.poster .pr{display:flex;align-items:baseline;gap:8px;position:relative;font-family:"IBM Plex Mono",monospace}
.poster .pr b{font-size:20px;color:#F2B705}
.poster .pr s{font-size:12px;opacity:.7}
.poster .ft{font-size:10px;opacity:.8;display:flex;justify-content:space-between;gap:6px;position:relative}

.camp-f{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.cost{font-size:12.5px;color:var(--muted);flex:1;min-width:200px}
.cost b{color:var(--ink);font-family:var(--mono);font-weight:500}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:transparent;border:1px solid var(--line)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));background:var(--surface);border-top:1px solid var(--line)}
.r{background:var(--surface);padding:10px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.r span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.r b{font-family:var(--mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.simnote{font-size:11px;color:var(--muted);padding:6px 14px;background:var(--surface)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
.sku{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.fit{color:var(--muted);font-size:12px}
.offer{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:11px;border-radius:3px;padding:0 5px;margin-left:4px}
.flag{font-size:11px;border-radius:3px;padding:0 5px;white-space:nowrap}
.flag.dead{background:var(--bad-soft);color:var(--bad)} .flag.fast{background:var(--good-soft);color:var(--good)}
.aud{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.filter{width:100%;max-width:420px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:var(--surface);color:var(--ink)}
.aud-c{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.aud-c h4{margin:0 0 6px;font-size:14px}
.aud-c dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:0;font-size:12.5px}
.aud-c dt{color:var(--muted)} .aud-c dd{margin:0;font-family:var(--mono);text-align:right}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center}

@media (max-width: 860px){
  .switch{display:flex}
  main.panes{grid-template-columns:1fr}
  .chat{border-right:0}
  .app[data-view="chat"] .work{display:none}
  .app[data-view="work"] .chat{display:none}
  .mode .ghost{display:none}
}
</style>
</head>
<body>
<div class="app" id="app" data-view="chat">
  <header class="top">
    <div class="logo">
      <span class="plate" aria-hidden="true">PRACHAAR</span>
      <div class="biz"><b id="bizName">Sri Venkateswara Auto Spares</b><span id="bizSub">AI CMO · Kukatpally, Hyderabad · sample data</span></div>
    </div>
    <div class="mode"><span class="dot" id="modeDot"></span><span id="modeText">Connecting…</span><span id="saveState" aria-live="polite"></span><span id="acct" hidden><span id="acctLinks"></span><button type="button" class="signout" id="signOut">Sign out</button></span><button class="ghost" id="resetBtn" type="button">Reset demo</button></div>
    <div class="switch" role="group" aria-label="View">
      <button type="button" id="vChat" aria-pressed="true">Chat</button>
      <button type="button" id="vWork" aria-pressed="false">Campaigns &amp; stock</button>
    </div>
  </header>
  <main class="panes">
    <section class="chat" aria-label="Chat with AI CMO">
      <div class="log" id="log" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <div class="vpanel" id="vPanel" hidden aria-live="polite">
        <div class="vorb" id="vOrb" aria-hidden="true"><span id="vLevel"></span></div>
        <div class="vtext"><b id="vState">Listening…</b><span id="vHint">Speak now. I'll reply out loud.</span></div>
        <button type="button" class="vbtn" id="vSkip" hidden>Skip</button>
        <button type="button" class="vbtn vend" id="vEnd" aria-label="End voice mode">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
          End voice</button>
      </div>
      <form class="composer" id="composer">
        <textarea id="input" rows="1" aria-label="Message to Prachaar" placeholder="e.g. 15% off on a part, send to garages on WhatsApp and Instagram"></textarea>
        <button type="button" class="stop" id="stopBtn" hidden>Stop</button>
        <button type="button" class="mic" id="micBtn" hidden aria-label="Speak your message" title="Talk to Prachaar. Tap again to go back to typing">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
          <span class="mic-t">Talk</span>
        </button>
        <button type="submit" class="send" id="sendBtn">Send</button>
      </form>
    </section>
    <section class="work" aria-label="Workspace">
      <div class="tabs" role="tablist">
        <button role="tab" id="tCamp" aria-selected="true" data-tab="camp">Campaigns<span class="count" id="cCamp">0</span></button>
        <button role="tab" id="tCat" aria-selected="false" data-tab="cat">Stock &amp; offers<span class="count" id="cOff">0</span></button>
        <button role="tab" id="tAud" aria-selected="false" data-tab="aud">Audiences</button>
      </div>
      <div class="pane" id="pane"></div>
    </section>
  </main>
</div>

<script>
(() => {
"use strict";
const BR = window.BRAND || {id:"prachaar", name:"Prachaar", assistant:"Prachaar", title:"Prachaar AI CMO", login:false};
const ANAME = BR.assistant;
const LIVE = null;   // Prachaar is a demo: WhatsApp sending is always simulated
document.getElementById("input").setAttribute("aria-label", "Message to " + ANAME);
document.getElementById("micBtn").title = `Talk to ${ANAME}. Tap again to go back to typing`;
let BIZ = { name:"Sri Venkateswara Auto Spares", short:"SVAS", area:"Kukatpally, Hyderabad", phone:"+91 90000 12345", minMargin:10 };
let DATASET = null;   // anonymised InsiTE data from the server (see tools/anonymize_insite.py)
const WA_RATE = 0.8631, GST = 0.18;
const TODAY = new Date();
const fmtDate = d => d.toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const inr2 = n => "₹" + n.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const cap = s => ({whatsapp:"WhatsApp",facebook:"Facebook",instagram:"Instagram"})[s] || (s[0].toUpperCase()+s.slice(1));
const pname = p => [p.brand,p.name].filter(Boolean).join(" ");

function findProducts(q){
  const words = String(q||"").toLowerCase().replace(/[^a-z0-9ऀ-౿ ]/g," ").split(/\s+/).filter(w=>w.length>1 && !["on","for","the","and","of","set","kit","parts","part"].includes(w));
  if(!words.length) return [];
  return S.products.map(p=>{
    const hay = (p.sku+" "+p.name+" "+p.brand+" "+p.fit+" "+p.cat).toLowerCase();
    let score = 0; for(const w of words){ if(hay.includes(w)) score += w.length>3?2:1; else if(w.length>4 && hay.includes(w.slice(0,-1))) score+=1; }
    return {p,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.p);
}
function productView(p){
  const o = activeOffer(p);
  return {sku:p.sku,name:p.name,brand:p.brand,fits:p.fit,category:p.cat,hsn:p.hsn,mrp:p.mrp,price_to_trade:p.price,
    offer: o?{percent:o.percent,offer_price:o.price,valid_until:fmtDate(o.until)}:null,
    stock_units:p.stock,margin_pct:Math.round((p.price-p.cost)/p.price*100),days_since_last_sale:p.lastSale};
}
function activeOffer(p){ return p.offer && p.offer.until >= startOfDay(TODAY) ? p.offer : null; }
function startOfDay(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function applyDiscount(sku, percent, days){
  const p = S.products.find(x=>x.sku===String(sku).toUpperCase());
  if(!p) throw new Error("No product with SKU "+sku+". Use search_products first.");
  percent = Number(percent); days = Math.round(Number(days)||7);
  if(!(percent>0 && percent<=60)) throw new Error("Discount must be between 1% and 60%.");
  if(days<1||days>60) days = 7;
  const price = Math.round(p.price*(1-percent/100));
  const margin = (price-p.cost)/price*100;
  if(margin < BIZ.minMargin){
    const maxPct = Math.floor((1 - p.cost/(1-BIZ.minMargin/100)/p.price)*100);
    throw new Error(`Blocked by margin guard: ${percent}% off leaves ${margin.toFixed(1)}% margin, below the ${BIZ.minMargin}% floor. Max allowed is ${Math.max(maxPct,0)}%.`);
  }
  const until = new Date(TODAY); until.setDate(until.getDate()+days);
  p.offer = {percent, price, was:p.price, until};
  render();
  return {sku:p.sku, name:p.name, old_price:p.price, offer_price:price, percent, margin_after_pct:Math.round(margin), valid_until:fmtDate(until), stock_units:p.stock};
}
function removeDiscount(sku){
  const p = S.products.find(x=>x.sku===String(sku).toUpperCase());
  if(!p) throw new Error("No product with SKU "+sku);
  p.offer = null; render(); return {sku:p.sku, price_now:p.price};
}

  if(input.replaces_id){ const old = S.campaigns.find(c=>c.id===input.replaces_id && c.status==="draft"); if(old) old.status="discarded"; }
  const o = o0;
  const c = {
    id:"C-"+String(S.seq++).padStart(4,"0"), name:String(input.name||("Offer: "+p0.name)).slice(0,80), status:"draft", created:new Date(),
    skus, audience:aud, channels:ch, language:String(input.language||"English"),
    headline:String(input.poster_headline||(o?o.percent+"% off":p0.name)).slice(0,48),
    offerSnap:o?{...o}:null,

    adBudget:Math.max(0,Math.round(Number(input.ad_budget_per_day_inr)||0)), adDays:Math.max(0,Math.round(Number(input.ad_days)||0))
  };
  if(c.adBudget && !c.adDays) c.adDays = 5;

  return {campaign_id:c.id, status:"draft — waiting for owner approval in the Campaigns panel", channels:ch, audience:aud,

// ---------- saving: business data on the server, chat in this browser ----------
let stateReady = false, stateRev = 0, lastSaved = "", saveTimer = null, persistOn = false, saving = false;
const DATE_KEYS = new Set(["created","sentAt","until"]);
function reviveState(st){
  return JSON.parse(JSON.stringify(st), (k,v)=> DATE_KEYS.has(k) && typeof v==="string" ? new Date(v) : v);
}
function snapshot(){
  const offers = {}; S.products.forEach(p=>{ if(p.offer) offers[p.sku]=p.offer; });
  return JSON.stringify({dataset: DATASET?DATASET.version:"sample", offers, campaigns:S.campaigns, seq:S.seq});
}
function setSaveState(t){ const el=$("saveState"); if(el) el.textContent=t; }
function scheduleSave(){
  if(!stateReady || !persistOn) return;
  clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400);
}
async function saveNow(){
  const snap = snapshot(); if(snap===lastSaved || saving) return;
  saving = true; setSaveState("Saving…");
  try{
    const payload = JSON.stringify({state:JSON.parse(snap),rev:stateRev});
    const r = await fetch("/api/state",{method:"PUT",keepalive:payload.length<60000,headers:{"content-type":"application/json","x-access-code":(typeof accessCode!=="undefined"?accessCode:"")},body:payload});
    const j = await r.json().catch(()=>({}));
    if(r.ok){ stateRev=j.rev; lastSaved=snap; setSaveState("Saved"); }
    else if(r.status===409 && j.state){ applyServerState(j); note("Campaigns were changed in another window, so I loaded the latest version."); }
    else setSaveState("Not saved (server storage unavailable)");
  }catch(_){ setSaveState("Not saved (offline)"); }
  finally{ saving=false; if(snapshot()!==lastSaved && persistOn) scheduleSave(); }
}
function applyServerState(j){
  const st = reviveState(j.state);
  if(st.offers){ S.products.forEach(p=>{ p.offer = st.offers[p.sku] || null; }); }
  else if(Array.isArray(st.products)){ const m = new Map(st.products.map(x=>[x.sku,x])); S.products.forEach(p=>{ const x=m.get(p.sku); if(x&&x.offer) p.offer=x.offer; }); }
  S.campaigns = st.campaigns.filter(c=>(c.skus||[]).every(k=>S.products.some(p=>p.sku===k)));
  S.seq = st.seq || (S.campaigns.length+1);
  stateRev = j.rev||0; lastSaved = snapshot();
  // finish any simulated send that was interrupted by a refresh
  S.campaigns.forEach(c=>{
    if(c.liveSending && c.status==="sending"){ c.status="sent"; c.live=true; c.sentAt=c.sentAt||new Date(); c.delivery={whatsapp:{sent:0,delivered:0,read:0}}; delete c.liveSending; return; }   // page closed mid-send: counts come from the server
    if(c.live) return;
    if(c.status==="sending") completeSend(c,true); else if(c.status==="sent" && !c.results) addResults(c,true); });
  render();
}
async function loadState(){
  try{
    const r = await fetch("/api/state",{cache:"no-store"});
    if(!r.ok) throw new Error("no store");
    const j = await r.json(); persistOn = true;
    if(j.state && Array.isArray(j.state.campaigns)) applyServerState(j);
    else { stateRev = j.rev||0; lastSaved = ""; }
    setSaveState(j.state ? "Saved" : "");
  }catch(_){ persistOn = false; setSaveState("Not saved (demo only)"); }
  stateReady = true; scheduleSave();
}

function completeSend(c, quiet){
  const a = AUDIENCES.find(x=>x.id===c.audience); c.delivery={};
  if(c.channels.includes("whatsapp")){ const del=Math.round(a.optIn*0.955); c.delivery.whatsapp={sent:a.optIn,delivered:del,cost:del*WA_RATE*(1+GST)}; }
  const boost = c.adBudget*c.adDays;
  if(c.channels.includes("facebook")) c.delivery.facebook={reach:Math.round(SOCIAL.facebook.followers*0.16 + boost*6.5)};
  if(c.channels.includes("instagram")) c.delivery.instagram={reach:Math.round(SOCIAL.instagram.followers*0.3 + boost*5)};
  c.status="sent"; c.sentAt=new Date();
  if(quiet){ addResults(c,true); return; }
  render(); note(`${c.id} sent (simulated) on ${c.channels.join(", ")}. Tracking orders…`);
  setTimeout(()=>addResults(c), 3500);
}
function addResults(c, quiet){
  const del = c.delivery&&c.delivery.whatsapp?c.delivery.whatsapp.delivered:0;
  const socialLeads = Math.round(((c.delivery?.facebook?.reach||0)+(c.delivery?.instagram?.reach||0))*0.004);
  const replies = Math.round(del*0.08)+socialLeads, orders = Math.max(1,Math.round(replies*0.45));
  const p = S.products.find(x=>x.sku===c.skus[0]); const unit = c.offerSnap?c.offerSnap.price:p.price;
  const units = Math.min(p.stock, orders*(p.price>2000?1:4));
  c.results={replies,orders,units,sales:units*unit};
  if(quiet) return;
  render(); note(`${c.id}: ${orders} orders, ${inr(units*unit)} in sales so far (simulated).`);
}

const log = $("log");

function mdLite(t){
  const blocks = esc(t).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").split(/\n{2,}/);
  return blocks.map(b=>{
    const lines=b.split("\n");
    if(lines.every(l=>/^\s*[-•*]\s+/.test(l))) return "<ul>"+lines.map(l=>"<li>"+l.replace(/^\s*[-•*]\s+/,"")+"</li>").join("")+"</ul>";
    return "<p>"+lines.join("<br>")+"</p>";
  }).join("");
}
function addMsg(role, html){

const RULES = () => `You are ${ANAME}, the AI CMO built into an Indian auto-parts distributor's inventory platform. You are chatting with the owner of ${BIZ.name}, ${BIZ.area}. They sell to garages, mechanics, parts shops and walk-in buyers. Today is ${TODAY.toDateString()}.

How to work:
- Reply in the owner's language (English, Hindi, Hinglish or Telugu). Keep replies short: 2–5 lines, plain words, rupees with Indian digit grouping (₹1,45,000).
- Find products with search_products before changing anything. If several match and the owner's words don't pick one, ask which (list SKU + name). Don't guess.
- apply_discount changes the trade price for the offer period; the owner's instruction is their approval. If the margin guard blocks it, tell them the maximum allowed and ask.
- For campaigns call create_campaign_draft with copy for each channel requested. You NEVER send: the owner reviews the draft in the Campaigns panel and taps "Approve & send". Say that clearly.
- If the owner names no channel, use WhatsApp only and mention Facebook/Instagram are available. If no audience is given, choose the best fit (garages for workshop parts, retailers for bulk stock, lapsed for win-back offers) and say which.
- To change an existing draft, create a new draft with replaces_id.
- Copy rules: WhatsApp ≤ 600 characters: offer first, product + vehicle fit, old and new price, valid-till date, how to order ("Reply ORDER or call ${BIZ.phone}"), last line "Reply STOP to opt out". Facebook: 2–4 lines. Instagram: 1–3 lines + 3–6 hashtags (#Hyderabad #AutoParts …). poster_headline: max 5 words. Write in the language the owner asks for (default English; Hindi/Telugu in native script when asked). No fake urgency, no claims you can't back.
- Paid boosts (ad_budget_per_day_inr) only if the owner asks for ads/boost or gives a budget.
- For "what should I promote?" use get_insights. For results use get_campaign_status. All sends and results here are a simulation; say so if asked.
- Never invent products, prices, stock or results.

Business facts: WhatsApp phone ${BIZ.phone}; margin floor ${BIZ.minMargin}%; WhatsApp marketing costs ₹${WA_RATE} + 18% GST per delivered message; Meta ads carry 18% GST.
${stateSummary()}`;

function tools(bubble){
  const wrap = (name, label, fn) => async (input, ctx) => {
    const chip = addAct(bubble, label(input));
    try { const r = await fn(input); chip.classList.add("ok"); console.log("[tool]", name, input, "→", r); return r; }
    catch(e){ chip.classList.add("err"); chip.title = e.message; chip.textContent += " ✗"; console.warn("[tool]", name, input, "✗", e.message); throw e; }
  };
  return [
    {name:"search_products",description:"Search the distributor's catalogue by product, brand, vehicle or SKU. Returns up to 6 matches with trade price, MRP, stock, margin, any active offer and days since last sale.",
     inputSchema:{type:"object",properties:{query:{type:"string"}},required:["query"]},
     execute: wrap("search", i=>"search: "+String(i.query||"").slice(0,30), i=>{ const r=findProducts(i.query).slice(0,6).map(productView); return r.length?r:"No matches. Try a vehicle model, brand or part type."; })},
    {name:"apply_discount",description:"Apply a percentage discount to one SKU's trade price for N days (default 7). Enforces the margin floor; throws with the max allowed % if blocked. Returns old and offer price.",
     inputSchema:{type:"object",properties:{sku:{type:"string"},percent:{type:"number"},days:{type:"number"}},required:["sku","percent"]},
     execute: wrap("discount", i=>`discount ${i.sku} ${i.percent}%`, i=>applyDiscount(i.sku,i.percent,i.days))},
    {name:"remove_discount",description:"End the active offer on a SKU and restore the normal trade price.",
     inputSchema:{type:"object",properties:{sku:{type:"string"}},required:["sku"]},
     execute: wrap("undiscount", i=>"end offer "+i.sku, i=>removeDiscount(i.sku))},
    {name:"list_audiences",description:"List customer audiences with total customers, WhatsApp opted-in counts and cost per WhatsApp blast, plus Facebook/Instagram follower counts.",
     execute: wrap("aud", ()=>"audiences", ()=>({audiences:AUDIENCES.map(a=>({id:a.id,name:a.name,customers:a.total,whatsapp_opted_in:a.optIn,blast_cost_inr:Math.round(waCost(a.id))})),social:SOCIAL}))},
    {name:"create_campaign_draft",description:"Create a campaign DRAFT with ready copy for WhatsApp, Facebook and/or Instagram. It appears in the Campaigns panel for the owner to approve; it is not sent. Uses the SKU's active offer for the poster. Returns id and estimated cost.",
     inputSchema:{type:"object",properties:{
       name:{type:"string",description:"Short campaign name"},
       skus:{type:"array",items:{type:"string"}},
       audience_id:{type:"string",enum:AUDIENCES.map(a=>a.id)},
       channels:{type:"array",items:{type:"string",enum:["whatsapp","facebook","instagram"]}},
       language:{type:"string"},
       poster_headline:{type:"string"},
       whatsapp_message:{type:"string"}, facebook_post:{type:"string"}, instagram_caption:{type:"string"},
       ad_budget_per_day_inr:{type:"number",description:"0 for organic posts only"}, ad_days:{type:"number"},
       replaces_id:{type:"string",description:"Draft id this one replaces"}},
       required:["name","skus","audience_id","channels","poster_headline"]},
     execute: wrap("draft", i=>"draft campaign → "+(Array.isArray(i.channels)?i.channels.join("+"):i.channels), i=>createDraft(i))},
    {name:"get_insights",description:"Marketing opportunities from inventory data: dead stock (no sale 90+ days), fast movers, lapsed customers, and the current season/festival context.",
     execute: wrap("ins", ()=>"insights", ()=>insights())},
    {name:"get_campaign_status",description:"Status, delivery and (simulated) results for a campaign id.",
     inputSchema:{type:"object",properties:{id:{type:"string"}},required:["id"]},
     execute: wrap("status", i=>"status "+i.id, i=>campaignStatus(String(i.id)))}
  ];
}
const ERR = {local_limit:"You've sent a lot of messages in the last 10 minutes. Wait a few minutes.",ai_busy:"The AI is busy right now.",daily_limit:"Today's AI limit for this demo is used up.",rate_limited:"Too many requests just now. Try again in a minute.",session_expired:"Your session expired. Sign in again to keep chatting.",refused:"I can't help with that request.",upstream_error:"The connection dropped. Send your message again.",empty_completion:"I didn't get an answer. Try rephrasing.",prompt_too_large:"The conversation got too long. Tap Reset demo to start fresh."};


// ---- server mode (Cloud Run backend holds the API key) ----
let apiMsgs = [], accessCode = "", awaitingCode = false;
try{ accessCode = sessionStorage.getItem("prachar-code") || ""; }catch(_){}
function trimApi(){
  // keep the last ~12 plain user turns; cut only at a plain user message so tool pairs stay intact
  const starts = apiMsgs.map((m,i)=> m.role==="user" && typeof m.content==="string" ? i : -1).filter(i=>i>=0);
  if(starts.length>12) apiMsgs = apiMsgs.slice(starts[starts.length-12]);
}
async function askServer(text){
  if(awaitingCode){ accessCode = text.trim(); awaitingCode=false; try{ sessionStorage.setItem("prachar-code", accessCode); }catch(_){}
    note("Access code saved. Send your request again."); return; }
  apiMsgs.push({role:"user",content:text}); trimApi();
  const bubble = addMsg("ai", `<span class="thinking">Thinking…</span>`);
  const body = bubble.querySelector(".body");
  const exec = Object.fromEntries(tools(bubble).map(t=>[t.name,t.execute]));
  ctl = new AbortController(); setBusy(true);
  let shown = "";
  try{
    for(let round=0; round<7; round++){
      const r = await fetch("/api/chat",{method:"POST",signal:ctl.signal,headers:{"content-type":"application/json","x-access-code":accessCode},
        body:JSON.stringify({state:stateSummary(), messages:apiMsgs, voice:VM.on})});
      if(r.status===401){ apiMsgs.pop(); awaitingCode=true; body.innerHTML="<p>This demo needs an access code. Type it below.</p>"; return; }
      if(!r.ok){ const j = await r.json().catch(()=>({})); const e = new Error(j.error||"upstream"); e.http=r.status; e.code=j.error; throw e; }
      const data = await r.json();
      const content = data.content||[];
      apiMsgs.push({role:"assistant",content});
      const txt = content.filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
      if(txt){ shown = shown ? shown+"\n\n"+txt : txt; body.innerHTML = mdLite(shown); log.scrollTop=log.scrollHeight; }
      const uses = content.filter(b=>b.type==="tool_use");
      if(!uses.length) break;
      const results = [];
      for(const u of uses){
        const fn = exec[u.name];
        try{ const out = fn ? await fn(u.input||{}, {signal:ctl.signal}) : (()=>{throw new Error("Unknown tool")})();
          results.push({type:"tool_result",tool_use_id:u.id,content: typeof out==="string"?out:JSON.stringify(out)}); }
        catch(e){ results.push({type:"tool_result",tool_use_id:u.id,content:"Error: "+(e.message||e),is_error:true}); }
      }
      apiMsgs.push({role:"user",content:results});
      if(!shown) body.innerHTML = `<span class="thinking">Working…</span>`;
    }
    if(!shown) body.innerHTML = "<p>Done. Check the Campaigns panel.</p>";
    // make sure the conversation ends on an assistant turn before the next user message
    if(apiMsgs.length && apiMsgs[apiMsgs.length-1].role==="user") apiMsgs.push({role:"assistant",content:[{type:"text",text:shown||"Done."}]});
  }catch(e){
    if(e && e.name==="AbortError"){ body.innerHTML = (shown?mdLite(shown):"")+"<p class='thinking'>Stopped.</p>"; }
    else if(!shown && !bubble.querySelector(".act")){
      // nothing happened yet: answer this message with the scripted demo instead of an error
      bubble.remove(); apiMsgs.length = 0;
      note("The AI is busy right now, so this reply uses demo mode.");
      offline(text);
    }
    else body.innerHTML = (shown?mdLite(shown):"")+`<p class="thinking">${esc(ERR[e&&e.code]||(e&&e.http===429?ERR.rate_limited:ERR.upstream_error))} Send the same message again to continue.</p>`;
    // drop the broken tail back to the last clean assistant turn
    while(apiMsgs.length && !(apiMsgs[apiMsgs.length-1].role==="assistant" && !apiMsgs[apiMsgs.length-1].content.some?.(b=>b.type==="tool_use"))) apiMsgs.pop();
  }finally{ setBusy(false); }
}

async function askAI(text){
  turns.push({role:"user",content:text});
  if(turns.length>16) turns = turns.slice(-16);
  while(turns.length && turns[0].role!=="user") turns.shift();
  const bubble = addMsg("ai", `<span class="thinking">Thinking…</span>`);
  const body = bubble.querySelector(".body");
  ctl = new AbortController(); setBusy(true);
  try{
    const res = await sample([{role:"user",content:RULES()}, ...turns], {cache:false, modelTier:"quick", signal:ctl.signal, tools:tools(bubble),
      onText:({text})=>{ body.innerHTML = mdLite(text); log.scrollTop=log.scrollHeight; }});
    body.innerHTML = mdLite(res.text);
    turns.push({role:"assistant",content:res.text});
  }catch(e){
    if(e && e.code==="cancelled"){ body.innerHTML = e.text?mdLite(e.text)+"<p class='thinking'>Stopped.</p>":"<p class='thinking'>Stopped.</p>"; }
    else if(e && ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","tools_unavailable"].includes(e.code)){
      setMode(false); turns.pop(); body.innerHTML = "<p>AI isn't available in this view, so I'll use demo mode.</p>"; offline(text, bubble);
    } else { body.innerHTML = (e && e.text?mdLite(e.text):"") + `<p class="thinking">${esc(ERR[e&&e.code]||ERR.upstream_error)}</p>`; }
  }finally{ setBusy(false); }
}

// offline demo parser (used when Claude isn't available in this view)
function offline(text, bubble){
  bubble = bubble || addMsg("ai","");
  const body = bubble.querySelector(".body");
  const t = text.toLowerCase();
  const say = h => { body.innerHTML += h; log.scrollTop=log.scrollHeight; };
  try{
    if(/promote|suggest|what should|dead stock|insight/.test(t) && !/%/.test(t)){
      addAct(bubble,"insights","ok"); const i=insights();
      const top = i.dead_stock_top10_by_value.slice(0,5), f0 = i.fast_movers[0];
      say(mdLite(`**Worth promoting this week** (slow stock with the most money tied up)\n\n${top.map(d=>`- ${d.name} (${d.fits}): ${d.stock_units} units, ${d.stock_value_at_cost} at cost, no sale in ${d.days_since_last_sale}${d.never_sold_in_data_window?"+":""} days`).join("\n")}\n\n${i.lapsed_customers.opted_in} lapsed regulars are opted in on WhatsApp.${top[0]?` Try: "15% off on ${top[0].name} for ${top[0].fits}, WhatsApp to garages".`:""}${f0?` Fast mover right now: ${f0.name} (${f0.fits}).`:""}`)); return;
    }
    const pm = t.match(/(\d{1,2})\s*%/);
    const q = (t.match(/(?:off|discount)\s+(?:on|for)?\s*(.+?)(?:\s+(?:and|&|then|,|send|to|for\s+\d|valid|till|campaign)\b|$)/)||[])[1];
    const before = pm ? t.split(pm[0])[0].replace(/apply|give|put/g," ") : "";
    if(!pm || (!q && !before.trim())){ say(mdLite(`In demo mode I understand commands like:\n\n${SUGG.filter(x=>/%/.test(x)).slice(0,2).map(x=>"- "+x).join("\n")}\n- What should I promote this week?`)); return; }
    const useBefore = /[a-z]{3,}/.test(before);
    const qq = useBefore ? before : q;
    let found = findProducts(qq);
    if(!found.length && q && useBefore) found = findProducts(q);
    addAct(bubble,"search: "+qq.trim().slice(0,30),"ok");
    if(!found.length){ say(mdLite(`I couldn't find "${q}" in stock. Try a vehicle or brand name.`)); return; }
    const p = found[0]; let r;
    const dAct = addAct(bubble,`discount ${p.sku} ${pm[1]}%`);
    const dm = t.match(/(\d{1,2})\s*days?/); try{ r = applyDiscount(p.sku, Number(pm[1]), dm?Number(dm[1]):7); dAct.classList.add("ok"); }
    catch(e){ dAct.classList.add("err"); say(mdLite(e.message)); return; }
    let ch = []; if(/whats|wa\b/.test(t)) ch.push("whatsapp"); if(/facebook|\bfb\b/.test(t)) ch.push("facebook"); if(/insta|\big\b/.test(t)) ch.push("instagram");
    const wantsCampaign = ch.length || /campaign|send|blast|post/.test(t);
    if(!wantsCampaign){ say(mdLite(`Done. **${pname(p)}** (${p.fit}) is now **${inr(r.offer_price)}** (was ${inr(r.old_price)}) till ${r.valid_until}. Margin after offer: ${r.margin_after_pct}%.\n\nWant me to send it to customers on WhatsApp, Facebook or Instagram?`)); return; }
    if(!ch.length) ch=["whatsapp"];
    let aud = /retail|shop|bulk/.test(t)?"retailers":/walk.?in|counter/.test(t)?"walkin":/lapsed|inactive/.test(t)?"lapsed":/all|everyone/.test(t)?"all":"garages";
    const wa = `${r.percent}% OFF – ${pname(p)}\nFits: ${p.fit}\nNow ${inr(r.offer_price)} (was ${inr(r.old_price)}) · Offer till ${r.valid_until}\n${p.stock} units ready in our ${BIZ.area.split(",")[0]} godown.\nReply ORDER or call ${BIZ.phone}.\nReply STOP to opt out.`;
    const fb = `${r.percent}% off ${pname(p)} for ${p.fit}.\nGarage price ${inr(r.offer_price)} (was ${inr(r.old_price)}), till ${r.valid_until}.\nWhatsApp us on ${BIZ.phone} to order.`;
    const ig = `${pname(p)} for ${p.fit} – now ${inr(r.offer_price)}. Offer till ${r.valid_until}. #Hyderabad #AutoParts #BikeParts #${(p.fit||p.brand||"Bike").split(/[ /(]/)[0].replace(/[^A-Za-z0-9]/g,"")}`;
    const dA = addAct(bubble,"draft campaign → "+ch.join("+"));
    const d = createDraft({name:`${r.percent}% off ${p.name} – ${p.fit.split("(")[0].trim()}`,skus:[p.sku],audience_id:aud,channels:ch,language:"English",poster_headline:`${p.name}`,whatsapp_message:wa,facebook_post:fb,instagram_caption:ig});
    dA.classList.add("ok");
    say(mdLite(`Done. **${pname(p)}** is now **${inr(r.offer_price)}** (was ${inr(r.old_price)}) till ${r.valid_until}.\n\nDraft **${d.campaign_id}** is ready for ${audName(aud)} on ${ch.map(cap).join(", ")}. Estimated cost ${inr(d.est_cost_inr)}. Check the previews and tap **Approve & send**.`));
    if(window.matchMedia("(max-width:860px)").matches) note("Tap “Campaigns & stock” above to review the draft.");
  }catch(e){ say(mdLite("Something went wrong: "+e.message)); }
}

function setBusy(b){ busy=b; $("sendBtn").disabled=b; $("stopBtn").hidden=!b; if(!b) saveChat(); }
async function loadMe(){}
function setMode(on){ aiReady=on; if(!on && aiMode!=="server") aiMode="off"; $("modeDot").className="dot "+(on?"on":"off"); $("modeText").textContent= on?"AI connected":"Demo mode (scripted)"; }
$("stopBtn").onclick = ()=> ctl && ctl.abort();
const input = $("input");
input.addEventListener("input", ()=>{ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,140)+"px"; });
input.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); $("composer").requestSubmit(); }});

// ---------- voice mode: tap the mic once, then it's a spoken conversation until "End voice" ----------
// listen → (pause detected) → transcribe (Sarvam) → AI → speak reply (Sarvam) → listen again
const VM = { on:false, mode:"off", stream:null, ctx:null, analyser:null, rec:null, gen:0, timer:null, lang:"unknown", audio:null, done:null, sr:null };
const VLABEL = {listening:"Listening…", hearing:"Listening…", transcribing:"Got it…", thinking:"Thinking…", speaking:"Speaking…"};
function vSet(state, hint){
  $("vPanel").dataset.state = state; $("vState").textContent = VLABEL[state] || state;
  if(hint !== undefined) $("vHint").textContent = hint;
  $("vSkip").hidden = state !== "speaking";
  if(state !== "listening" && state !== "hearing") $("vLevel").style.height = "0";
}
function stopSpeaking(){
  if(VM.audio){ try{ VM.audio.pause(); }catch(_){} VM.audio = null; }
  if(window.speechSynthesis) try{ speechSynthesis.cancel(); }catch(_){}
  if(VM.done){ const d = VM.done; VM.done = null; d(); }
}
function initVoice(serverVoice){
  const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder && (window.AudioContext||window.webkitAudioContext));
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  VM.mode = serverVoice && canRecord ? "sarvam" : (SR && window.speechSynthesis ? "browser" : "off");
  if(VM.mode === "off") return;
  $("micBtn").hidden = false;
  $("micBtn").addEventListener("click", startVoice);
  $("vEnd").addEventListener("click", endVoice);
  $("vSkip").addEventListener("click", ()=>stopSpeaking());
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && VM.on) endVoice(); });
}
async function startVoice(){
  if(busy || VM.on) return;
  if(VM.mode === "sarvam"){
    try{ VM.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}}); }
    catch(e){ note(e && e.name==="NotAllowedError" ? "Microphone is blocked. Allow it from the icon in the browser's address bar, then tap Talk again." : "No microphone found."); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    VM.ctx = new AC(); const src = VM.ctx.createMediaStreamSource(VM.stream);
    VM.analyser = VM.ctx.createAnalyser(); VM.analyser.fftSize = 1024; src.connect(VM.analyser);
  }
  VM.on = true; stopSpeaking();
  $("composer").hidden = true; $("chips").hidden = true; $("vPanel").hidden = false;
  listen();
}
function endVoice(){
  VM.on = false; VM.gen++; clearInterval(VM.timer); stopSpeaking();
  if(VM.rec && VM.rec.state !== "inactive"){ VM.rec._discard = true; try{ VM.rec.stop(); }catch(_){} }
  VM.rec = null;
  if(VM.sr){ try{ VM.sr.abort(); }catch(_){} VM.sr = null; }
  if(VM.stream){ VM.stream.getTracks().forEach(t=>t.stop()); VM.stream = null; }
  if(VM.ctx){ try{ VM.ctx.close(); }catch(_){} VM.ctx = null; }
  $("vPanel").hidden = true; $("composer").hidden = false; input.focus();
}
function listen(hint){
  if(!VM.on) return;
  const gen = ++VM.gen; clearInterval(VM.timer);
  if(VM.mode === "browser") return listenBrowser(gen, hint);
  const types = ["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4"];
  const mime = types.find(t=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
  const chunks = []; const rec = new MediaRecorder(VM.stream, mime ? {mimeType:mime, audioBitsPerSecond:32000} : undefined);
  VM.rec = rec;
  rec.ondataavailable = e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = ()=>{ if(rec._discard || gen !== VM.gen || !VM.on) return; handleUtterance(new Blob(chunks, {type: rec.mimeType || mime || "audio/webm"}), gen); };
  if(VM.ctx && VM.ctx.state === "suspended") VM.ctx.resume();
  rec.start(200);
  vSet("listening", hint || "Speak now. I'll reply out loud.");
  // simple voice-activity detection on the mic level
  const buf = new Float32Array(VM.analyser.fftSize), t0 = performance.now(), cal = [];
  let started = false, speechAt = 0, lastLoud = 0, floor = 0.008;
  VM.timer = setInterval(()=>{
    if(gen !== VM.gen || !VM.on){ clearInterval(VM.timer); return; }
    VM.analyser.getFloatTimeDomainData(buf);
    let sum = 0; for(let i=0;i<buf.length;i++) sum += buf[i]*buf[i];
    const rms = Math.sqrt(sum/buf.length), now = performance.now(), el = now - t0;
    if(el < 400){ cal.push(rms); floor = Math.max(0.006, cal.slice().sort((a,b)=>a-b)[Math.floor(cal.length/2)]); return; }
    const thr = Math.max(0.018, floor*2.6);
    $("vLevel").style.height = Math.min(100, Math.round(rms/0.12*100)) + "%";
    if(rms > thr){ if(!started){ started = true; speechAt = now; vSet("hearing", "I'll send when you pause."); } lastLoud = now; }
    const stop = discard=>{ clearInterval(VM.timer); if(discard) rec._discard = true; if(rec.state !== "inactive") rec.stop(); };
    if(started && now - lastLoud > 1100 && now - speechAt > 500) return stop(false);   // you paused: send
    if(started && now - speechAt > 25000) return stop(false);                          // 25 s limit
    if(!started && el > 15000){ stop(true); listen("Still listening… say something, or tap End voice."); }  // nothing said: start a fresh clip
  }, 50);
}
async function handleUtterance(blob, gen){
  if(blob.size < 800){ return listen("Didn't catch that. Try again."); }
  vSet("transcribing", "");
  let t = "", lang = "unknown";
  try{
    const r = await fetch("/api/stt?lang=unknown", {method:"POST", headers:{"content-type": blob.type || "audio/webm"}, body: blob});
    const j = await r.json().catch(()=>({}));
    if(!r.ok){
      if(j.error === "voice_key"){ endVoice(); note("The Sarvam API key was rejected. Restart start-local.ps1 with -ResetVoiceKey."); return; }
      throw new Error(j.error === "local_limit" ? ERR.local_limit : "transcribe");
    }
    t = (j.transcript || "").trim(); lang = j.language_code || "unknown";
  }catch(e){ if(gen === VM.gen && VM.on) listen(e.message === "transcribe" ? "Couldn't hear that clearly. Please say it again." : e.message); return; }
  if(gen !== VM.gen || !VM.on) return;
  if(!t) return listen("Didn't catch that. Try again.");
  await converse(t, lang, gen);
}
async function converse(t, lang, gen){
  VM.lang = lang || "unknown";
  vSet("thinking", "“" + t + "”");
  await sendMessage(t);
  if(gen !== VM.gen || !VM.on) return;
  await speakReply(gen);
  if(gen === VM.gen && VM.on) listen();
}
function lastReplyText(){
  const b = [...log.querySelectorAll(".msg.ai .body")].pop();
  return b ? b.innerText.trim() : "";
}
async function speakReply(gen){
  const txt = lastReplyText(); if(!txt) return;
  vSet("speaking", txt.replace(/\s+/g," ").slice(0,90));
  if(VM.mode === "browser") return speakBrowser(txt);
  try{
    const r = await fetch(`/api/tts?lang=${encodeURIComponent(VM.lang)}`, {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({text: txt})});
    if(!r.ok || gen !== VM.gen || !VM.on) return;
    const url = URL.createObjectURL(await r.blob());
    await new Promise(res=>{
      const a = new Audio(url); VM.audio = a; VM.done = res;
      a.onended = a.onerror = ()=>{ URL.revokeObjectURL(url); if(VM.done === res){ VM.done = null; VM.audio = null; } res(); };
      a.play().catch(()=>res());
    });
  }catch(_){}
}
// fallback without the Sarvam key: the browser's own recognition + voices (Chrome/Edge)
function listenBrowser(gen, hint){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const r = new SR(); r.lang = VM.lang !== "unknown" ? VM.lang : "en-IN"; r.interimResults = false; r.continuous = false;
  let got = ""; VM.sr = r;
  r.onresult = e=>{ got = Array.from(e.results).map(x=>x[0].transcript).join(" "); };
  r.onerror = e=>{ if(e.error === "not-allowed"){ endVoice(); note("Microphone is blocked. Allow it from the icon in the browser's address bar."); } };
  r.onend = ()=>{ VM.sr = null; if(gen !== VM.gen || !VM.on) return; if(got.trim()) converse(got.trim(), r.lang, gen); else listen("Still listening…"); };
  vSet("listening", hint || "Speak now. I'll reply out loud."); try{ r.start(); }catch(_){}
}
function speakBrowser(txt){
  return new Promise(res=>{
    const u = new SpeechSynthesisUtterance(txt.slice(0,600));
    u.lang = /[ఀ-౿]/.test(txt) ? "te-IN" : /[ऀ-ॿ]/.test(txt) ? "hi-IN" : "en-IN";
    VM.done = res; u.onend = u.onerror = ()=>{ if(VM.done === res) VM.done = null; res(); };
    speechSynthesis.speak(u);
  });
}

async function sendMessage(text){
  addMsg("me", esc(text)); $("chips").hidden = true;
  if(aiMode === "server") await askServer(text);
  else if(aiReady && sample) await askAI(text);
  else offline(text);
}
$("composer").addEventListener("submit", e=>{
  e.preventDefault(); const text = input.value.trim(); if(!text || busy) return;
  input.value = ""; input.style.height = "auto";
  sendMessage(text);
});

let SUGG = ["What should I promote this week?"];   // replaced with real part suggestions once the dataset loads
async function loadDataset(){
  try{
    const r = await fetch("/api/dataset",{cache:"no-store"}); if(!r.ok) return false;
    const d = await r.json(); if(!d || !Array.isArray(d.products) || !d.products.length) return false;
    DATASET = d; SEED_PRODUCTS = d.products; AUDIENCES = d.audiences; SOCIAL = d.social || SOCIAL;
    BIZ = {...BIZ, name:d.store.name, short:d.store.short, area:d.store.area, phone:d.store.phone};
    const ex = d.products.find(p=>p.fast) || d.products[0];
    $("input").placeholder = `e.g. 15% off on ${ex.name} for ${ex.fit}, send to garages on WhatsApp and Instagram`;
    $("bizName").textContent = BIZ.name; $("bizSub").textContent = `AI CMO · ${BIZ.area} · anonymised test data`;
    document.title = BR.title;
    return true;
  }catch(_){ return false; }
}
function buildSugg(){
  const dead = S.products.filter(p=>p.lastSale>=90&&p.stock>0).sort((a,b)=>b.stock*b.cost-a.stock*a.cost);
  const fast = S.products.filter(p=>p.fast).sort((a,b)=>(b.sold30||0)-(a.sold30||0));
  const d = dead[0], d2 = dead[1]||dead[0], f = fast[0];
  if(!d || !f) return;
  SUGG = [
    `Apply 15% off on ${d.name} for ${d.fit} and send a campaign to garages on WhatsApp and Instagram`,
    "What should I promote this week?",
    `Win back lapsed regulars: 10% off ${f.name} for ${f.fit}, WhatsApp message in Telugu`,
    `Clear ${d2.name} (${d2.fit}) stock: 12% off for 10 days to parts shops, and boost on Instagram with ₹300 a day for 5 days`
  ];
}
function chips(){ $("chips").innerHTML = SUGG.map((s,i)=>`<button type="button" class="chip" data-i="${i}">${esc(s)}</button>`).join(""); }
$("chips").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b||busy) return; input.value=SUGG[b.dataset.i]; $("composer").requestSubmit(); });
function headsUp(){
  const d=S.products.filter(p=>p.lastSale>=90&&p.stock>0).sort((a,b)=>b.stock*b.cost-a.stock*a.cost)[0];
  if(!d) return "";
  return `**Heads-up:** ${d.stock.toLocaleString("en-IN")} × ${d.name} (${d.fit}) worth ${inr(d.stock*d.cost)} at cost ${d.neverSold?`haven't sold in the last ${d.lastSale} days`:`last sold ${d.lastSale} days ago`}.`;
}
function welcome(){
  log.innerHTML="";
  addMsg("ai", mdLite(`Namaste! I'm **${ANAME}**, your AI CMO. I can see your stock, prices and customer lists.\n\nTell me what you want, like an offer on a part and where to send it. I'll set the price, write the WhatsApp message and posts, and prepare a draft for you to approve.\n\n${headsUp()}`));
}
$("resetBtn").onclick = ()=>{ if(ctl) ctl.abort(); seed(); turns=[]; apiMsgs=[]; clearChat(); welcome(); $("chips").hidden=false; render(); };
$("vChat").onclick=()=>{ $("app").dataset.view="chat"; $("vChat").setAttribute("aria-pressed","true"); $("vWork").setAttribute("aria-pressed","false"); };
$("vWork").onclick=()=>{ $("app").dataset.view="work"; $("vWork").setAttribute("aria-pressed","true"); $("vChat").setAttribute("aria-pressed","false"); };

(async ()=>{
  if(await loadDataset()){ seed(); buildSugg(); chips(); if(!restoreChat()) welcome(); render(); await loadState(); loadMe(); }
  else {
    render(); $("chips").hidden = true;
    addMsg("ai", mdLite("I couldn't load the store data. Refresh the page. If this keeps happening, check that the server is running and that `dataset/insite-demo.json` exists."));
  }
})();
(async ()=>{
  try{
    const h = await fetch("/api/health",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);
    if(h) initVoice(!!h.voice);
    if(h && h.ai){ aiMode="server"; aiReady=true; $("modeDot").className="dot on"; $("modeText").textContent="AI connected"; return; }
  }catch(_){}
  try{
    sample = window.claude ? await window.claude.use("sample") : null;
    const lim = sample ? await sample.limits().catch(()=>null) : null;
    setMode(!!(sample && lim && lim.tools));
  }catch(_){ setMode(false); }
})();
})();
